name: Compare embedders (hashing vs MiniLM)

# Runs `make compare` on GitHub's servers, which can download the MiniLM weights,
# and commits the result to results/compare.md. Runs by hand, or when this file changes.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/minilm-compare.yml

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-minilm.txt
      - name: Run the comparison
        run: |
          mkdir -p results
          {
            echo "# Hashing vs MiniLM on the golden sets"
            echo
            echo "Generated by .github/workflows/minilm-compare.yml on GitHub's servers ($(date -u +%Y-%m-%d), commit ${GITHUB_SHA::7})."
            echo "Latency depends on the machine; the other metrics don't."
            echo
            python -c "import sentence_transformers, torch, huggingface_hub as h; print(f'sentence-transformers {sentence_transformers.__version__}, torch {torch.__version__}, model sentence-transformers/all-MiniLM-L6-v2 at revision', h.model_info('sentence-transformers/all-MiniLM-L6-v2').sha)"
            echo
            make compare
          } | tee results/compare.md
          if grep -q "not measured" results/compare.md; then echo "MiniLM did not load"; exit 1; fi
      - name: Commit the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/compare.md
          if git diff --cached --quiet; then echo "Unchanged"; exit 0; fi
          git commit -m "Record hashing vs MiniLM comparison"
          git push
